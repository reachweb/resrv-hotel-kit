{{# Feature tiles — a bento row of self-contained tiles (image, title, short text,
    optional link); the first tile spans wider. #}}
<section class="section">
    <div class="container-rsv">
        {{ partial:section-header :heading="heading" :intro="intro" }}
        {{ if tiles }}
            <div class="grid gap-5 md:grid-cols-2 lg:grid-cols-3 auto-rows-[280px]">
                {{ tiles }}{{ partial:feature-tile }}{{ /tiles }}
            </div>
        {{ /if }}
    </div>
</section>
