{{#
    Detail-page h1 (rooms/show, spa/show) with an optional plain meta line
    below it, passed as {{ slot }}. `title` is read from the entry in scope.
#}}
<div class="mb-6 reveal">
    <h1 class="t-h1">{{ title }}</h1>
    {{ if slot }}<p class="text-base text-muted mt-2">{{ slot }}</p>{{ /if }}
</div>
