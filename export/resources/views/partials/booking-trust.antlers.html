{{#
    Booking-panel trust line: shield icon + reassurance copy. Param: label — a
    booking-global note (booking:room_panel_note etc.); renders nothing when empty.
    The icon is inline, so a note that wraps on a phone keeps it beside its first word.
#}}
{{ if label }}
<p class="text-sm text-muted text-center text-balance mt-3">
    <svg class="inline-block size-4 align-[-0.2em] me-1" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10Z"/><path d="m9 12 2 2 4-4"/></svg>
    {{ label }}
</p>
{{ /if }}
