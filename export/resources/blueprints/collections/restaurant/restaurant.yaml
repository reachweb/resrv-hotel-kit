title: Restaurant
tabs:
  main:
    display: Content
    sections:
      -
        fields:
          -
            handle: title
            field:
              type: text
              display: 'Venue name'
              localizable: true
              validate: [required]
          -
            handle: slug
            field:
              type: slug
              display: Slug
              localizable: true
              generate: true
              validate: [required]
          -
            handle: tagline
            field:
              type: text
              display: Tagline
              localizable: true
              instructions: 'Short descriptor (e.g. "Sea-facing restaurant").'
          -
            handle: image
            field:
              type: assets
              display: Image
              container: assets
              folder: dining
              max_files: 1
              mode: grid
              instructions: 'Recommended ratio 3:2. Degrades gracefully if empty.'
          -
            handle: body
            field: prose.body
  details:
    display: Details
    sections:
      -
        fields:
          -
            handle: hours
            field:
              type: grid
              display: Hours
              mode: table
              add_row: 'Add service'
              fields:
                -
                  handle: label
                  field: { type: text, display: Service, width: 33 }
                -
                  handle: time
                  field: { type: text, display: Time, width: 33 }
                -
                  handle: bookable
                  field: { type: toggle, display: Bookable, width: 33, instructions: 'Shown above the table booking. Turn on for services set up as Resrv sittings.' }
          -
            handle: closed_days
            field:
              type: checkboxes
              display: 'Closed days'
              inline: true
              options:
                Monday: Monday
                Tuesday: Tuesday
                Wednesday: Wednesday
                Thursday: Thursday
                Friday: Friday
                Saturday: Saturday
                Sunday: Sunday
              instructions: 'Weekdays the restaurant takes no bookings. They must match the venue''s Resrv availability (no sittings on those days). They can''t be picked in the date field, the hours line names them, and a closed day says so instead of looking fully booked.'
          -
            handle: booking_note
            field:
              type: text
              display: 'Booking note'
              localizable: true
              instructions: 'One line under the table booking: what guests choose at checkout, and which services need no booking.'
  booking:
    display: Booking
    sections:
      -
        display: Resrv
        instructions: 'Single-date table availability (quantity = covers per sitting). Lunch/Dinner sittings are Resrv rates scoped to this collection; arrival times are a free Resrv Option; extras (e.g. champagne) are assigned in Resrv → Extras — all managed in Resrv → CP (not here).'
        fields:
          -
            handle: availability
            field: { type: resrv_availability, display: Availability }
          -
            handle: options
            field: { type: resrv_options, display: Options }
          -
            handle: extras
            field: { type: resrv_extras, display: Extras }
          -
            handle: cutoff
            field: { type: resrv_cutoff, display: Cutoff }
  seo:
    display: SEO
    sections:
      -
        fields:
          - import: seo
