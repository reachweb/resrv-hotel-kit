title: Review
tabs:
  main:
    display: Content
    sections:
      -
        fields:
          -
            handle: guest_name
            field: { type: text, display: 'Guest name', validate: [required], width: 50 }
          -
            handle: rating
            field:
              type: integer
              display: Rating
              instructions: '1–5 stars.'
              default: 5
              validate: ['integer', 'min:1', 'max:5']
              width: 50
          -
            handle: quote
            field: { type: textarea, display: Quote, validate: [required] }
          -
            handle: stay_type
            field: { type: text, display: 'Stay type', instructions: 'e.g. Honeymoon, Family holiday.', width: 50 }
          -
            handle: source
            field: { type: text, display: Source, instructions: 'e.g. Verified stay, Google.', default: 'Verified stay', width: 50 }
          -
            handle: room
            field:
              type: entries
              display: Room
              instructions: 'The room this review is about, if it names one. Room pages show their own reviews first, then reviews with no room, never another room''s.'
              collections: [rooms]
              max_items: 1
              mode: select
